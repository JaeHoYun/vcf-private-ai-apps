<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="416" viewBox="0 0 1160 416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">신원이 표현되는 네 경계와 자체 앱 경로</title>
<desc id="d">사용자 요청은 네 경계를 거친다. ① 사용자에서 BFF까지는 조직 IdP가 발급한 사용자 토큰(OIDC)으로 사용자, 그룹, 테넌트가 전달된다. ② BFF에서 PAIS 에이전트와 모델까지는 서비스 토큰으로 호출하므로 사용자 신원이 유실되고 PAIS는 호출한 앱만 확인한다. ③ PAIS에서 MCP 도구 서버까지는 정적 도구 토큰이라 도구 서버는 PAIS가 호출했다는 것만 확인하고, ④ PAIS에서 지식베이스까지는 인스턴스와 네임스페이스 권한으로 에이전트에 연결된 지식베이스 전체에 접근한다. 따라서 관리형 에이전트 경로의 도구와 지식베이스는 에이전트의 모든 사용자에게 안전한 범위로 한정한다. 자체 앱 경로에서는 BFF가 토큰 교환으로 받은 사용자 범위 토큰으로 사내 시스템과 커스텀 검색을 직접 호출한다.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="548" y="40" width="588" height="352" rx="10" fill="#ffebe9" opacity="0.55"/>
