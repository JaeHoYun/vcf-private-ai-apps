<text x="686" y="134.04" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">PAIS 에이전트, 모델</text>
<text x="686" y="152.82" font-size="13" text-anchor="middle" fill="#59636e">호출한 앱만 확인</text>
