<text x="972" y="309.04" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">설계 결론</text>
<text x="972" y="327.82" font-size="13" text-anchor="middle" fill="#59636e">도구와 지식베이스는 에이전트의</text>
