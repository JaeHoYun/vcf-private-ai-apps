<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="992" viewBox="0 0 1160 992" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">데이터 소스 온보딩의 여섯 개 존</title>
<desc id="d">존 1 분산 소스 저장소의 문서를 존 2 수집 커넥터가 암호문 상태로 가져오고, 존 3 복호화 전처리(격리 구역)가 문서보안 서버와 키 서버에 전용 서비스 계정으로 요청해 복호화한 뒤 정규화, 형식 변환, OCR, PII 마스킹, 청킹, 접근 주체 평탄화를 거쳐 S3 호환 스테이징에 저장한다. 평문은 존 3 밖으로 나가지 않고, 등급과 허용 그룹이 붙은 청크만 존 4 인덱스 저장소로 전송된다. 존 4는 PAIS Data Indexing and Retrieval 또는 커스텀 pgvector이며 등급별 DSM PostgreSQL 인스턴스에 저장한다. 존 5의 앱과 BFF는 사용자 그룹 클레임으로 사전 필터해 검색하고 출력 통제를 거쳐 답을 제시한다. 존 6은 복호화 로그, 검색 로그, LLM 추적을 중앙 수집하고, 문서보안 서버의 정책 변경 이벤트를 받아 해당 청크를 즉시 비활성화한다.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
<rect x="24" y="24" width="1088" height="112" rx="10" fill="none" stroke="#484f58" stroke-width="1.5"/>
<text x="38" y="46" font-size="13" font-weight="700" fill="#9198a1">존 1. 분산 소스 저장소 (기존 시스템)</text>
