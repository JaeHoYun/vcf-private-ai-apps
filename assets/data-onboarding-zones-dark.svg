<text x="726" y="617.54" font-size="15" font-weight="700" text-anchor="middle" fill="#f0f6fc">and Retrieval</text>
<text x="726" y="636.32" font-size="13" text-anchor="middle" fill="#9198a1">관리형 지식베이스</text>
<text x="726" y="654.32" font-size="13" text-anchor="middle" fill="#9198a1">지식베이스와 인스턴스가 경계</text>
