<text x="292" y="234.04" font-size="15" font-weight="700" text-anchor="middle" fill="#f0f6fc">크롤러와 커넥터</text>
<text x="292" y="252.82" font-size="13" text-anchor="middle" fill="#9198a1">변경 감지 커서, 중복 제거, 버전 관리</text>
