<text x="568" y="86.04" font-size="15" font-weight="700" text-anchor="middle" fill="#f0f6fc">파일 서버, NAS</text>
<text x="568" y="104.82" font-size="13" text-anchor="middle" fill="#9198a1">우선 대상</text>
<rect x="768" y="60" width="328" height="60" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="932" y="86.04" font-size="15" font-weight="700" text-anchor="middle" fill="#f0f6fc">그룹웨어 첨부, 개인 PC</text>
<text x="932" y="104.82" font-size="13" text-anchor="middle" fill="#9198a1">중앙 저장소로 모은 뒤 대상</text>
<rect x="24" y="176" width="536" height="104" rx="10" fill="none" stroke="#484f58" stroke-width="1.5"/>
<text x="38" y="198" font-size="13" font-weight="700" fill="#9198a1">존 2. 수집 (존 3과 같은 네임스페이스)</text>
