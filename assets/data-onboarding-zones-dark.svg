<rect x="476" y="372" width="184" height="92" rx="8" fill="#231c35" stroke="#8957e5" stroke-width="1.5"/>
<text x="568" y="405.04" font-size="15" font-weight="700" text-anchor="middle" fill="#f0f6fc">PII 마스킹, 청킹</text>
<text x="568" y="423.82" font-size="13" text-anchor="middle" fill="#9198a1">개인정보를 가린 뒤</text>
<text x="568" y="441.82" font-size="13" text-anchor="middle" fill="#9198a1">청크로 분할</text>
<rect x="694" y="372" width="184" height="92" rx="8" fill="#231c35" stroke="#8957e5" stroke-width="1.5"/>
<text x="786" y="405.04" font-size="15" font-weight="700" text-anchor="middle" fill="#f0f6fc">접근 주체 평탄화</text>
<text x="786" y="423.82" font-size="13" text-anchor="middle" fill="#9198a1">정책을 허용 그룹 목록으로</text>
<text x="786" y="441.82" font-size="13" text-anchor="middle" fill="#9198a1">비어 있으면 제한 처리</text>
