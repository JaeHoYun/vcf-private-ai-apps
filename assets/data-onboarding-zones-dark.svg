<text x="986" y="643.82" font-size="13" text-anchor="middle" fill="#9198a1">문서 단위 접근 주체 필터</text>
<text x="856" y="625" font-size="13" font-weight="700" text-anchor="middle" fill="#9198a1">또는</text>
