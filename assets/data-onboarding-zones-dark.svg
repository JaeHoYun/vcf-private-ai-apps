<rect x="600" y="192" width="400" height="72" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="800" y="215.04" font-size="15" font-weight="700" text-anchor="middle" fill="#f0f6fc">문서보안 서버, 키 서버</text>
<text x="800" y="233.82" font-size="13" text-anchor="middle" fill="#9198a1">기존 시스템. 전용 서비스 계정과</text>
<text x="800" y="251.82" font-size="13" text-anchor="middle" fill="#9198a1">허용 프로세스를 별도 정책으로 등록</text>
<rect x="24" y="328" width="1088" height="156" rx="10" fill="none" stroke="#8957e5" stroke-width="2"/>
<text x="258" y="350" font-size="13" font-weight="700" fill="#ab7df8">존 3. 복호화 전처리 (격리 VKS 클러스터나 네임스페이스, NSX 분산 방화벽)</text>
<text x="1098" y="350" font-size="13" font-weight="700" text-anchor="end" fill="#ab7df8">평문은 이 존 밖으로 나가지 않음</text>
